<script>
    var close = 0;
    // Single function to open any game
    function opengame(path){
        if (path){
            try{
                const nparent = document.getElementById("nparent");
                const parent = document.getElementById("parent");
                const app = document.getElementById("app");
                app.src = path;
                app.style.display = "block";
                parent.style.display = "none";
                nparent.style.display = "none";
                document.getElementById('sidebar').style.display = "none";
                document.getElementById('x').style.display = "block";
                close = 1;
            }
            catch(e){
                console.log(e);
                alert("An error occurred: " + e);
            }
        }
    }

    // Ninja island series menu (not a game, shows sub-options)
    function nseries(){
        const nparent = document.getElementById("nparent");
        nparent.style.display = "contents";
    }
    async function loadgames(){
        const req = await fetch('/games.json')
        const json = await req.json()
        let parent = document.getElementById('parent')
        for (const x in json){
            let obj = json[x]
            const namehtml = obj.name
            const id = obj.id
            const url = obj.url
            parent.innerHTML += `
            <div class="icon" onclick="opengame('${url}')" id="${id}">
            <span class="bookmark-icon" onclick="event.stopPropagation(); bookmark('${id}');"></span>
            <p style="color: white;">${namehtml}</p>
            </div>
            `
        }
    }
    setTimeout(loadgames(), 500)
</script>
